services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 20
  api:
    build: ./apps/api
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDEMPTION_KEY: ${REDEMPTION_KEY}
      CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPassword123!}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.cli bootstrap_admin && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  scheduler:
    build: ./apps/api
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.scheduler
  web:
    build: ./apps/web
  proxy:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '8025:8025'
volumes:
  postgres_data:
  uploads:
