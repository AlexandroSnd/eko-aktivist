server {
  listen 80;
  server_name _;
  client_max_body_size 11m;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /openapi.json { proxy_pass http://api:8000; }
  location /docs { proxy_pass http://api:8000; }
  location /uploads/ { proxy_pass http://api:8000; }
  location /health { proxy_pass http://api:8000; }
  location / { proxy_pass http://web:80; }
}
